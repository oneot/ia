<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Creative Agent Team</title>
<style>
  :root {
    --ink: #0f2a43;
    --muted: #5b7690;
    --accent: #0ea5e9;
    --accent-2: #6366f1;
    --glass: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.75);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Pretendard", -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 500px at 8% 0%, #bfe6ff 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 10%, #dcd9ff 0%, transparent 55%),
      radial-gradient(700px 500px at 50% 110%, #c9f3ff 0%, transparent 60%),
      #eef6fc;
    display: flex;
    flex-direction: column;
    padding: clamp(10px, 2.5vw, 28px);
    gap: 14px;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow: 0 8px 30px rgba(14, 90, 150, 0.10), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .logo {
    width: 38px; height: 38px; border-radius: 12px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; color: #fff; font-size: 20px;
    box-shadow: 0 6px 16px rgba(14, 165, 233, .35);
  }
  .title { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }
  .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .status {
    margin-left: auto; display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--muted);
    padding: 6px 12px; border-radius: 999px;
    background: rgba(255,255,255,.6); border: 1px solid var(--glass-border);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
    box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: pulse 2s infinite;
  }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .frame {
    position: relative; flex: 1; min-height: 0;
    padding: 8px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    box-shadow: 0 20px 60px rgba(14, 90, 150, 0.14), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .frame::before {
    content: "채팅을 불러오는 중…";
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 14px;
  }
  iframe {
    position: relative; width: 100%; height: 100%;
    border: 0; border-radius: 18px; background: #fff;
  }
  @media (max-width: 600px) {
    .sub, .status { display: none; }
    header { padding: 10px 14px; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo">✦</div>
    <div>
      <div class="title">AI Creative Agent Team</div>
      <div class="sub">팀장 에이전트에게 기획부터 결과물 제작까지 요청하세요</div>
    </div>
    <div class="status"><span class="dot"></span>온라인</div>
  </header>

  <main class="frame">
    <iframe
      src="https://copilotstudio.microsoft.com/environments/Default-9ef36566-f756-4f11-9c5f-307c10f409f9/bots/cre46_aicreativeagentteam_AfPlpF/webchat?__version__=2&enableFileAttachment=false&cliAgent=true"
      title="AI Creative Agent Team 채팅"
      allow="clipboard-read; clipboard-write"
      loading="eager"></iframe>
  </main>
</body>
</html>
